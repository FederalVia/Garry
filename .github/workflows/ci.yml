name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Typecheck tests
        run: pnpm run typecheck:test
      # A timeout fails the job. The suite takes about 30 seconds.
      - name: Run tests
        timeout-minutes: 10
        run: pnpm test
      # vitest filters by test name with -t. It has no --grep option.
      - name: Run security tests
        timeout-minutes: 5
        run: pnpm exec vitest run -t "security|injection|policy|financial"

  security-audit:
    runs-on: ubuntu-latest
    # Fails on high and critical advisories. Four moderate ones remain under
    # @solana/web3.js > jayson, in code the agent never loads: uuid (affects
    # v3/v5/v6 with a buffer; jayson only calls v4) and stream-json (used by
    # jayson's TCP/TLS server and client; @solana/web3.js only requires
    # jayson/lib/client/browser, which never loads it). Clearing them needs
    # jayson 5, outside @solana/web3.js's supported range.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
