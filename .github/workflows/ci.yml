name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Typecheck tests
        run: pnpm run typecheck:test
      # A timeout fails the job. The suite takes about 30 seconds.
      - name: Run tests
        timeout-minutes: 10
        run: pnpm test
      # vitest filters by test name with -t. It has no --grep option.
      - name: Run security tests
        timeout-minutes: 5
        run: pnpm exec vitest run -t "security|injection|policy|financial"

  security-audit:
    runs-on: ubuntu-latest
    # Known advisories show this job as failed without blocking the run.
    # Remove continue-on-error once the dependencies are upgraded.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
